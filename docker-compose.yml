services:
  scratchbox:
    build:
      context: .
      # To bundle the Unistore integration's `tex3ds` binary, uncomment:
      # args:
      #   BASE_IMAGE: devkitpro/devkitarm:latest
    ports:
      - "3000:3000"
    environment:
      - NITRO_JWT_SECRET=${JWT_SECRET}
      - NITRO_AUTH_PROJECT_ID=${AUTH_PROJECT_ID}
      - NITRO_AUTH_PROJECT_AUTHOR=${AUTH_PROJECT_AUTHOR}
      - DB_URL=/data/sqlite.db
      - HOST_MOUNT=${SB_DATA_DIR}/sb-root
    volumes:
      - ${SB_DATA_DIR:?set SB_DATA_DIR to an absolute host path}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
